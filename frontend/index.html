<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>S10 遥控台 v3.0</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --txt:#1c2330; --sub:#6b7686;
          --accent:#2563eb; --danger:#dc2626; --ok:#16a34a; --warn:#d97706; }
  /* REQ-032：四模块版面间距整体压缩（模块间/卡片内边距/标题下边距/方向盘尺寸/按钮与列表高度） */
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10;}
  header h1 { font-size:16px; margin:0; }
  .conn { font-size:12px; padding:3px 10px; border-radius:12px; background:#fee2e2; color:var(--danger); }
  .conn.on { background:#dcfce7; color:var(--ok); }
  main { display:grid; grid-template-columns: 1fr; gap:8px; padding:10px; max-width:980px; margin:0 auto; }
  @media(min-width:860px){ main { grid-template-columns: 340px 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px; }
  .card h2 { font-size:13px; color:var(--sub); margin:0 0 10px; font-weight:600; letter-spacing:.5px; }
  .cardh { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:7px;
           flex-wrap:wrap; row-gap:4px; }
  .cardh h2 { margin:0; flex:0 0 auto; }
  .cardh .tleft { display:flex; align-items:center; gap:6px; flex:0 1 auto; min-width:0; }
  .cardh .hgrp { display:flex; align-items:center; gap:6px; flex:0 0 auto; margin-left:auto; }
  .cardh .sline { flex:1 1 auto; min-width:0; text-align:right; font-size:11px; color:var(--sub);
                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cardh .sline.warn { color:var(--danger); font-weight:600; }
  /* REQ-029：网络时延/带宽，紧跟「状态」标题，纯数值无文字说明 */
  .cardh .netstat { font-size:11px; color:var(--sub); font-variant-numeric:tabular-nums;
                    white-space:nowrap; flex:0 0 auto; }
  /* 页签切换（机位 / 语音模式） */
  .tabs { display:inline-flex; align-items:center; gap:1px; padding:2px 1px; flex:0 0 auto;
          background:#f1f3f7; border:1px solid var(--line); border-radius:12px; }
  /* REQ-038：语音模块三个同级页签，窄屏也要塞进标题行 */
  #audTabs button.tab { padding:3px 6px; font-size:11px; }
  button.tab { border:0; background:transparent; color:var(--sub); padding:3px 7px; font-size:11.5px;
               font-weight:600; line-height:1.25; border-radius:9px; white-space:nowrap; }
  button.tab:active { transform:none; }
  button.tab.on { background:var(--accent); color:#fff; box-shadow:0 1px 3px rgba(37,99,235,.35); }
  button.loopbtn, button.stopbtn { padding:4px 10px; font-size:12px; font-weight:600; border-radius:14px; line-height:1.2; }
  button.stopbtn { color:var(--danger); border-color:#fca5a5; background:#fef2f2; }
  button.stopbtn:active { background:#fee2e2; }
  /* 单向喊话（2026-11-17）：按住说话，录音中红底呼吸；外观从简 */
  button.shoutbtn { padding:8px 10px; font-size:13px; font-weight:700; border-radius:10px;
                    background:#eff6ff; border-color:#93b4f5; color:#1d4ed8; line-height:1.2;
                    touch-action:none; -webkit-user-select:none; user-select:none; }
  button.shoutbtn.rec { background:var(--danger); border-color:var(--danger); color:#fff;
                        animation:shoutpulse 1s ease-in-out infinite; }
  button.shoutbtn:disabled { opacity:.55; cursor:not-allowed; }
  @keyframes shoutpulse { 0%,100%{ box-shadow:0 0 0 0 rgba(239,68,68,.45) } 50%{ box-shadow:0 0 0 6px rgba(239,68,68,0) } }
  #shoutTip { font-size:11px; color:var(--sub); text-align:center; min-height:14px; line-height:1.3; }
  /* D-036：麦克风自检入口（喊话/对讲两面板共用一套逻辑） */
  .mictest { font-size:11px; color:var(--sub); background:none; cursor:pointer;
             border:1px dashed var(--line); border-radius:8px; padding:4px 10px; }
  .mictest:hover { color:#111; }
  /* 双向对讲（REQ-041）：外观从简，重点是把「MIC 被抢占」计数显式摆出来 */
  #paneTalk:not([hidden]) { display:grid; gap:5px; }
  #talkTip { font-size:11px; color:var(--sub); text-align:center; min-height:14px; line-height:1.3; }
  .micpre { font-size:11.5px; font-weight:700; color:#15803d; background:#f0fdf4;
            border:1px solid #bbf7d0; border-radius:8px; padding:4px 8px; text-align:center; }
  .micpre.warn { color:var(--danger); background:#fef2f2; border-color:#fecaca; }
  /* 用 :not([hidden]) 避免 display 覆盖 hidden 属性（否则隐藏失效） */
  #paneShout:not([hidden]) { display:grid; gap:5px; }
  .statusgrid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px; font-size:11px; }
  .statusgrid > div { min-width:0; }
  .statusgrid .k { color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .statusgrid .v { display:flex; align-items:baseline; gap:2px; margin-top:1px;
                   font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; }
  .statusgrid .vs { font-size:9.5px; color:var(--sub); font-weight:500; min-width:0;
                    overflow:hidden; text-overflow:ellipsis; }
  .k { color:var(--sub); }
  /* REQ-044：圆形八向方向盘（取代原十字盘）。
     上/下=前进/后退，左/右=原地转向，左上/右上=前进中转向；
     拖动中不松手从斜向拖回正上即恢复直行，松手回中停止。
     圆盘是连续拖动控件，touch-action:none 仅作用于这块 186px 区域，页面其余仍可正常滚动。 */
  .wheel { position:relative; width:186px; height:186px; margin:8px auto 0; border-radius:50%;
           border:2px solid var(--line); background:#eef1f5;
           box-shadow:inset 0 2px 7px rgba(25,45,80,.07);
           touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .wheel.dis { background:#f4f6f9; border-color:#e7ebf1; pointer-events:none; }
  .wheel .wring { position:absolute; inset:25px; border-radius:50%; border:1px dashed #d6dee9; pointer-events:none; }
  .wheel .wtick { position:absolute; font-size:11px; font-weight:600; color:#93a0b4; pointer-events:none; }
  .wheel .wtick.t { top:6px; left:50%; transform:translateX(-50%); }
  .wheel .wtick.b { bottom:6px; left:50%; transform:translateX(-50%); }
  .wheel .wtick.l { left:8px; top:50%; transform:translateY(-50%); }
  .wheel .wtick.r { right:8px; top:50%; transform:translateY(-50%); }
  .wheel .wthumb { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px;
                   border-radius:50%; background:#fff; border:2px solid var(--accent); color:var(--accent);
                   display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
                   box-shadow:0 2px 9px rgba(20,40,80,.15); pointer-events:none; white-space:nowrap;
                   transition:transform .07s linear, background .12s, color .12s; }
  .wheel.active .wthumb { background:var(--accent); color:#fff; }
  /* 按钮 */
  .btns { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  /* v2.5：运动控制 5 键同一行（站立/趴下/步态三档），急停移到卡片右上角 */
  .btns.five { grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
  .btns.five button { padding:10px 2px; font-size:12.5px; white-space:nowrap; letter-spacing:-.2px; }
  .btns.five button.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  button.estoph { padding:5px 11px; font-size:13px; background:var(--danger); border-color:var(--danger);
                  color:#fff; border-radius:14px; line-height:1.2; }
  /* REQ-033：档位切换按钮（运动控制标题旁，点击循环 低速→中速→高速） */
  button.gearbtn { padding:4px 10px; font-size:12px; border-radius:12px; line-height:1.2;
                   background:#eff6ff; border-color:#93b4f5; color:#1d4ed8; white-space:nowrap; }
  button.gearbtn b { font-variant-numeric:tabular-nums; }
  /* REQ-042：休眠/唤醒切换（运动控制标题旁）。休眠中=橙底提示可唤醒；平时=休眠入口 */
  button.sleepbtn { background:#fff7ed; border-color:#fdba74; color:#c2410c; }
  button.sleepbtn.on { background:#fdba74; border-color:#f97316; color:#fff; }
  button { border:1px solid var(--line); background:var(--card); color:var(--txt); border-radius:10px;
           padding:12px 6px; font-size:14px; cursor:pointer; font-weight:600; }
  button:active { transform:scale(.96); }
  button.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.dgr { background:var(--danger); border-color:var(--danger); color:#fff; grid-column:span 3; padding:16px; font-size:17px; }
  /* 速度控制使能：卡片标题行内的滑动开关（开=绿右 / 关=灰左），无文字说明 */
  button.sw { width:42px; height:24px; padding:2px; border-radius:13px; background:#cbd2dc;
              border:1px solid #b6bfcc; position:relative; flex:0 0 auto;
              transition:background .18s, border-color .18s; }
  button.sw i { display:flex; align-items:center; justify-content:center; width:18px; height:18px;
                border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25);
                transition:transform .18s; font-size:10px; font-style:normal; line-height:1; }
  button.sw.on { background:var(--ok); border-color:var(--ok); }
  button.sw.on i { transform:translateX(18px); }
  button.sw:active { transform:none; }
  button.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  button.wide3 { grid-column:span 3; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  /* 音频 */
  .alist { display:grid; grid-template-columns:1fr 1fr; align-content:start; gap:4px 6px;
           max-height:220px; overflow:auto; }
  .alist .aempty { grid-column:1 / -1; font-size:12px; color:var(--sub); padding:4px 2px 2px; line-height:1.5; }
  .alist button { text-align:left; font-size:12px; padding:6px 8px; font-weight:500; line-height:1.2;
                  display:flex; align-items:center; gap:5px; white-space:nowrap; overflow:hidden; }
  .alist button b { display:inline; flex:0 0 auto; font-size:10.5px; color:var(--sub); font-weight:400; }
  .alist button span { overflow:hidden; text-overflow:ellipsis; }
  .alist button.sel { border-color:var(--accent); background:#eff6ff; color:#1d4ed8;
                      box-shadow:0 0 0 2px rgba(37,99,235,.12); }
  /* 播报中图示：三根跳动音量条，仅框选时出现 */
  .alist button .eq { display:none; flex:0 0 auto; margin-left:auto; align-items:flex-end; gap:2px; height:11px; }
  .alist button.sel .eq { display:inline-flex; }
  .alist button .eq b { display:block; width:2px; border-radius:1px; background:currentColor;
                        transform-origin:bottom; animation:eqbar .85s ease-in-out infinite; }
  .alist button .eq b:nth-child(1){ height:5px; animation-delay:0s; }
  .alist button .eq b:nth-child(2){ height:11px; animation-delay:.15s; }
  .alist button .eq b:nth-child(3){ height:7px; animation-delay:.3s; }
  @keyframes eqbar { 0%,100%{ transform:scaleY(.35) } 50%{ transform:scaleY(1) } }
  /* REQ-031：日志模块默认隐藏，连点顶部标题 5 次显示，模块内「隐藏」按钮可再次隐藏 */
  #logBox[hidden] { display:none; }
  .loghead { display:flex; align-items:center; justify-content:space-between; }
  button.loghide { border:1px solid var(--line); background:transparent; color:var(--sub);
                   font-size:11px; padding:2px 8px; border-radius:8px; cursor:pointer; }
  button.loghide:active { background:#eef1f5; }
  .alog { font-size:11px; color:var(--sub); white-space:pre-wrap; max-height:72px; overflow:auto;
          background:#f2f4f7; border-radius:8px; padding:6px; margin-top:6px; }
  .rangelab { font-size:12px; color:var(--sub); margin:8px 0 3px; }
  input[type=range] { width:100%; }
  .hint { font-size:11px; color:var(--sub); margin-top:8px; line-height:1.6; }
  /* ---- v2.7 登录层（公网入口必须鉴权，D-003） ---- */
  #gate { position:fixed; inset:0; z-index:999; display:none; align-items:center; justify-content:center;
          background:rgba(28,35,48,.55); backdrop-filter:blur(2px); padding:20px; }
  #gate.show { display:flex; }
  #gate .box { width:100%; max-width:330px; background:var(--card); border-radius:14px; padding:20px;
               box-shadow:0 12px 40px rgba(0,0,0,.22); }
  #gate h2 { font-size:15px; margin:0 0 4px; letter-spacing:0; color:var(--txt); }
  #gate p { font-size:12px; color:var(--sub); margin:0 0 14px; line-height:1.6; }
  #gate input { width:100%; padding:10px 12px; font-size:14px; border:1px solid var(--line);
                border-radius:9px; outline:none; background:#fff; color:var(--txt); }
  #gate input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  #gate button { width:100%; margin-top:12px; padding:10px; font-size:14px; font-weight:600;
                 border:0; border-radius:9px; background:var(--accent); color:#fff; }
  #gate button:active { opacity:.85; }
  #gate .err { font-size:12px; color:var(--danger); margin-top:10px; min-height:16px; }
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h2>🔒 需要访问口令</h2>
    <p>该控制台已开放公网访问，请输入访问口令后继续。</p>
    <input id="gateInput" type="password" placeholder="访问口令" autocomplete="current-password">
    <button onclick="doLogin()">进入控制台</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>
<header>
  <h1 id="consoleTitle">🐾 S10 遥控台 <span style="font-size:11px;color:var(--sub)">v3.0</span></h1>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="conn" id="conn">连接中…</span>
  </div>
</header>
<main>
  <section>
    <div class="card">
      <div class="cardh">
        <div class="tleft">
          <h2>状态</h2>
          <span class="netstat" id="netstat">…ms  …Mb/s</span>
        </div>
        <div class="sline" id="s_line">-</div>
      </div>
      <div class="statusgrid">
        <div><div class="k">运动状态</div><div class="v" id="s_state">-</div></div>
        <div><div class="k">步态</div><div class="v" id="s_gait">-</div></div>
        <div><div class="k">速度 m/s</div><div class="v" id="s_vel">-</div></div>
        <div><div class="k">音频</div><div class="v"><span id="s_audio">-</span><span class="vs" id="s_audio_st">-</span></div></div>
        <div><div class="k">电量</div><div class="v"><span id="s_batt">-</span><span class="vs" id="s_batt_st">-</span></div></div>
      </div>
    </div>
    <div class="card" style="margin-top:8px">
      <div class="cardh">
        <div class="tleft">
          <h2>摄像头</h2>
          <div class="tabs" id="camTabs">
            <button class="tab" data-cam="video4" onclick="setCam('video4')">前视</button>
            <button class="tab" data-cam="video0" onclick="setCam('video0')">后视</button>
            <button class="tab" data-cam="video2" onclick="setCam('video2')">左视</button>
            <button class="tab" data-cam="video6" onclick="setCam('video6')">右视</button>
          </div>
        </div>
        <div class="hgrp">
          <button class="sw" id="camBtn" onclick="toggleCam()" title="视频已关闭（点击开启）" aria-label="视频开关"><i>🔒</i></button>
        </div>
      </div>
      <div style="position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9">
        <img id="camImg" style="width:100%;height:100%;object-fit:contain;display:none" alt="摄像头画面">
        <div id="camHint" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa4b2;font-size:12px;text-align:center;padding:0 10px">已关闭</div>
      </div>
    </div>
  </section>
  <section>
    <div class="card">
      <div class="cardh">
        <div class="tleft">
          <h2>运动控制</h2>
          <button class="gearbtn" id="gearBtn" onclick="cycleGear()" title="点击切换速度档位（低速/中速/高速）">中速 <b>0.8m/s</b></button>
          <!-- REQ-042：休眠/唤醒切换（D-039 休眠事件后新增）。休眠=趴下+关节下电（4→2 序列），唤醒=自动站立 -->
          <button class="gearbtn sleepbtn" id="sleepBtn" onclick="toggleSleep()" title="点击进入休眠（趴下并关节下电）">🌙 休眠</button>
        </div>
        <div class="hgrp">
          <button class="sw" id="armBtn" onclick="toggleArm()" title="速度控制未使能（点击开启）" aria-label="速度控制使能"><i>🔒</i></button>
          <button class="estoph" onclick="estop()">⛔ 急停</button>
        </div>
      </div>
      <!-- REQ-044：圆形八向方向盘。拖动 thumb 到斜向=前进中转向；拖回正上=恢复直行；松手=回中停止 -->
      <div class="wheel dis" id="wheel">
        <div class="wring"></div>
        <span class="wtick t">前 ▲</span>
        <span class="wtick b">▼ 后</span>
        <span class="wtick l">◀ 左</span>
        <span class="wtick r">右 ▶</span>
        <div class="wthumb" id="wthumb">停</div>
      </div>
      <div class="btns five">
        <button onclick="stand()">站立</button>
        <button onclick="mstate(4)">趴下</button>
        <button id="g_flat" onclick="gait(G_FLAT)">步态·平地</button>
        <button id="g_stair" onclick="gait(G_STAIR)">步态·楼梯</button>
        <button id="g_high" onclick="gaitHigh()">步态·高台</button>
      </div>
    </div>
    <div class="card" style="margin-top:8px">
      <div class="cardh">
        <div class="tleft">
          <h2>语音</h2>
          <!-- REQ-038：语音播报 / 一键喊话 / 双向对讲 三个同级功能，切换页签 -->
          <div class="tabs" id="audTabs">
            <button class="tab on" data-tab="say" onclick="setAudioMode('say')">语音播报</button>
            <button class="tab" data-tab="shout" onclick="setAudioMode('shout')">一键喊话</button>
            <button class="tab" data-tab="talk" onclick="setAudioMode('talk')">双向对讲</button>
          </div>
        </div>
      </div>
      <!-- 页签一：语音播报 = 自定义音频播报（REQ-038 取消系统音），保留停止播报 / 循环 -->
      <div id="paneSay">
        <div class="row2" style="margin:0 0 6px">
          <button class="stopbtn" onclick="astop()">⏹ 停止播报</button>
          <button class="loopbtn" id="loopBtn" onclick="toggleLoop()">循环关</button>
        </div>
        <div class="alist" id="alist"></div>
      </div>
      <!-- 页签二：一键喊话 = 按住说话，松开发送（录完即播） -->
      <div id="paneShout" hidden>
        <button class="shoutbtn" id="shoutBtn">🎤 按住说话</button>
        <div id="shoutTip">长按说话，边说边播（仅 Chrome + HTTPS）</div>
        <button class="mictest" id="micTestBtn1" type="button">🎤 麦克风自检（采集无声时用）</button>
      </div>
      <!-- 页签三：双向对讲（REQ-041）：手机↔机器人 双向音频，MIC 抢占计数可见 -->
      <div id="paneTalk" hidden>
        <button class="shoutbtn" id="talkBtn">📞 开始对讲</button>
        <div id="talkTip">双向对讲：手机 ↔ 机器人（仅 Chrome + HTTPS）</div>
        <div class="micpre" id="talkMic">MIC 被抢占 0 次</div>
        <button class="mictest" id="micTestBtn2" type="button">🎤 麦克风自检（采集无声时用）</button>
      </div>
      <div id="logBox" hidden>
        <div class="loghead">
          <div class="rangelab" style="margin-top:10px">日志</div>
          <button class="loghide" type="button" onclick="hideLog()">隐藏</button>
        </div>
        <div class="alog" id="alog">-</div>
      </div>
    </div>
  </section>
</main>
<script>
const STATE_TXT = {0:"空闲",1:"站立",2:"软急停",3:"开机阻尼",4:"趴下",17:"全站姿",4097:"阻尼趴下(休眠)"};
/* v2.5：步态三档固定（平地/楼梯/高台），基础步态不再单独给按钮（站立后自动就是基础） */
const G_FLAT = 0x3002, G_STAIR = 0x3003, G_HIGH = 0x1002;
const GAIT_TXT = {[G_HIGH]:"高台",[G_FLAT]:"平地",[G_STAIR]:"楼梯",4097:"基础"};
let ARMED = false, PRESETS = [], curNav = {x:0,y:0,yaw:0}, STAND_TIP = 0, CUR_GAIT = 0;
let LOOP = localStorage.getItem("s10yk_loop") === "1";
function setLoop(v){
  LOOP = v;
  localStorage.setItem("s10yk_loop", v ? "1" : "0");
  const b = document.getElementById("loopBtn");
  if(!b) return;
  b.classList.toggle("on", v);
  b.textContent = v ? "循环开" : "循环关";
}
function toggleLoop(){ setLoop(!LOOP); }

async function api(path, body) {
  /* v2.3：所有请求带 3s 超时，防止机器人重启/断网时请求挂死占满浏览器并发连接 */
  const opt = body !== undefined
    ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}
    : {};
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 3000);
  try{
    const r = await fetch(path, Object.assign(opt, {signal:ctl.signal}));
    if (r.status === 401) { showGate(); return {__unauth:true}; }
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

/* ---- v2.7 访问鉴权（Cookie 会话；<img> 拉流也能自动带凭证） ---- */
function showGate(){
  const g = document.getElementById("gate");
  if (g) { g.classList.add("show"); setTimeout(()=>document.getElementById("gateInput").focus(), 60); }
}
function hideGate(){
  const g = document.getElementById("gate");
  if (g) g.classList.remove("show");
}
async function checkAuth(){
  try{
    const r = await fetch("/api/auth", {cache:"no-store"});
    if (r.ok) { hideGate(); return true; }
  }catch(e){}
  showGate();
  return false;
}
async function doLogin(){
  const inp = document.getElementById("gateInput");
  const err = document.getElementById("gateErr");
  const v = (inp.value || "").trim();
  if (!v) { err.textContent = "请输入口令"; return; }
  err.textContent = "";
  try{
    const r = await fetch("/api/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({token: v})
    });
    if (r.ok) { location.reload(); }
    else { err.textContent = (r.status === 401) ? "口令不正确" : ("登录失败 " + r.status); inp.select(); }
  }catch(e){ err.textContent = "无法连接服务器"; }
}
function mstate(s){ api("/api/motion/state",{state:s}); }
/* 站立 = 起立(1) + 后端自动补 RL(17)，避免停在半蹲 */
function stand(){ STAND_TIP = Date.now() + 6000; mstate(1); }
function gait(g){ api("/api/gait",{gait:g}); }
/* 高台（0x1002，常规模式）再点一次回到基础（0x1001），与官方遥控器的切换行为一致，
   否则进了高台就没有"退出"的按钮了 */
function gaitHigh(){ gait(Number(CUR_GAIT) === G_HIGH ? 4097 : G_HIGH); }
function estop(){ setArm(false); api("/api/estop",{}); }
/* REQ-042：休眠/唤醒切换。休眠=趴下后关节下电（后端序列 4→2；厂商协议无独立休眠指令）；
   唤醒=后端站立序列 1→17→自动挂步态。状态以后端 /api/status 回报为准（poll 同步）。 */
let SLEEPING = false;
async function toggleSleep(){
  const target = !SLEEPING;
  const r = await api("/api/motion/sleep", {sleep: target});
  if (r && r.ok){
    setSleep(!!r.sleep);
    if (!r.sleep) STAND_TIP = Date.now() + 6000;   /* 唤醒=站立，给起立提示留 6s */
  }
}
function setSleep(v){
  SLEEPING = v;
  const b = document.getElementById("sleepBtn");
  b.textContent = v ? "☀️ 唤醒" : "🌙 休眠";
  b.classList.toggle("on", v);
  b.title = v ? "机器人休眠中（趴下+关节下电），点击唤醒（自动站立）"
              : "点击进入休眠（趴下并关节下电；厂商休眠还含关相机等，此处为协议等效通道）";
  /* 休眠中禁止方向盘操作（速度使能也已被后端撤销），唤醒后按 ARMED 状态恢复 */
  document.getElementById("wheel").classList.toggle("dis", v || !ARMED);
}
async function toggleArm(){ const r = await api("/api/arm",{armed:!ARMED}); setArm(r.armed); }
function setArm(v){
  ARMED = v;
  const b = document.getElementById("armBtn");
  b.classList.toggle("on", v);
  b.title = v ? "速度控制已使能（点击关闭）" : "速度控制未使能（点击开启）";
  b.firstElementChild.textContent = v ? "🔓" : "🔒";
  document.getElementById("wheel").classList.toggle("dis", !v || SLEEPING);  /* REQ-042：休眠中保持锁定 */
  if (!v) wheelSet("stop");
}
/* ---- 播报框选状态（v1.8）---- */
let SEL_BTN = null, SEL_TMR = 0;
function clearSel(){
  if (SEL_TMR){ clearTimeout(SEL_TMR); SEL_TMR = 0; }
  if (SEL_BTN){ SEL_BTN.classList.remove("sel"); SEL_BTN = null; }
}
function markSel(btn, duration_ms, loop){
  clearSel();
  if (!btn) return;
  SEL_BTN = btn;
  btn.classList.add("sel");
  /* 单次播报：按后端返回的时长定时取消；循环播报：等「停止播报」或切歌 */
  if (!loop && duration_ms > 0){
    SEL_TMR = setTimeout(()=>{ if (SEL_BTN === btn) clearSel(); }, duration_ms + 400);
  }
}

function astop(){ clearSel(); api("/api/audio/stop",{}); }
function play(a, btn){
  if(a.say){
    document.getElementById("alog").textContent =
      (LOOP ? "循环播放：" : "推送播放：") + a.name + " …";
    api("/api/audio/say", {file:a.file, loop:LOOP}).then(r=>{
      markSel(btn, r.duration_ms || 0, LOOP);
      document.getElementById("alog").textContent =
        (LOOP ? "循环播放：" : "推送播放：") + a.name + " → " +
        (r.ok ? ("已发送到 103 声卡" + (LOOP ? "（循环，点「停止播报」结束）" : "")) : JSON.stringify(r));
    }).catch(e=>{
      clearSel();
      document.getElementById("alog").textContent = "播放失败：" + e;
    });
    return;
  }
  document.getElementById("alog").textContent =
    (LOOP ? "循环播放：" : "播放：") + a.name + " …";
  api("/api/audio/play", {id:a.id, priority:5, loop:LOOP}).then(r=>{
    if (r && r.ok) markSel(btn, r.duration_ms || 0, LOOP);
  }).catch(e=>{
    clearSel();
    document.getElementById("alog").textContent = "播放失败：" + e;
  });
}

/* REQ-033：速度档位（低/中/高，默认中速）。十字盘只发方向，档位大小由后端 GEAR_IDX 决定。 */
const GEARS = [ {name:"低速", spd:"0.3m/s"}, {name:"中速", spd:"0.8m/s"}, {name:"高速", spd:"1.3m/s"} ];
let GEAR_IDX = 1;   /* 默认中速 */
function renderGear(){
  const b = document.getElementById("gearBtn");
  if (!b) return;
  const g = GEARS[GEAR_IDX];
  b.innerHTML = g.name + ' <b>' + g.spd + '</b>';
  b.title = "当前" + g.name + "（" + g.spd + "）· 点击切换速度档位";
}
function cycleGear(){
  GEAR_IDX = (GEAR_IDX + 1) % GEARS.length;
  renderGear();
  api("/api/gear", {idx: GEAR_IDX});   /* 同步后端，下个 nav 周期生效 */
}

/* REQ-044：圆形八向方向盘（取代十字盘，解决前进+转向互斥）。
   8 个离散档位对齐后端 STEER 量化能力；斜向=前进(后退)同时转向。
   关键交互：拖动中不松手，从「前+左」拖回「前」即恢复直行；松手/失焦才回中停止。
   键盘 ↑+← 同理：松开 ← 自动恢复 ↑，不必松开 ↑ 再重按。 */
const WHEEL_VEC = {
  stop:{x:0, yaw:0}, fwd:{x:0.6, yaw:0}, back:{x:-0.6, yaw:0},
  left:{x:0, yaw:0.6}, right:{x:0, yaw:-0.6},
  fwdleft:{x:0.6, yaw:0.6}, fwdright:{x:0.6, yaw:-0.6},
  backleft:{x:-0.6, yaw:0.6}, backright:{x:-0.6, yaw:-0.6}
};
const WHEEL_TXT = { stop:"停", fwd:"前进", back:"后退", left:"左转", right:"右转",
                    fwdleft:"前+左", fwdright:"前+右", backleft:"后+左", backright:"后+右" };
const WHEEL_POS = { stop:[0,0], fwd:[0,-1], back:[0,1], left:[-1,0], right:[1,0],
                    fwdleft:[-0.72,-0.72], fwdright:[0.72,-0.72],
                    backleft:[-0.72,0.72], backright:[0.72,0.72] };
const WHEEL_THROW = 46;   /* thumb 最大偏移像素 */
let WHEEL_DIR = "stop";
function wheelSet(dir){
  if (dir !== "stop" && (!ARMED || SLEEPING)) return;
  WHEEL_DIR = WHEEL_VEC[dir] ? dir : "stop";
  const v = WHEEL_VEC[WHEEL_DIR];
  curNav.x = v.x; curNav.y = 0; curNav.yaw = v.yaw;
  const [px, py] = WHEEL_POS[WHEEL_DIR];
  const th = document.getElementById("wthumb");
  if (th){
    th.style.transform = "translate(" + (px*WHEEL_THROW).toFixed(1) + "px," + (py*WHEEL_THROW).toFixed(1) + "px)";
    th.textContent = WHEEL_TXT[WHEEL_DIR];
  }
  document.getElementById("wheel").classList.toggle("active", WHEEL_DIR !== "stop");
  sendNav();
}
function wheelDirFromXY(dx, dy){
  const r = Math.hypot(dx, dy);
  if (r < 12) return "stop";                         /* 中心死区，防误触 */
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (ax < r*0.42) return dy < 0 ? "fwd" : "back";    /* 竖直扇区 */
  if (ay < r*0.42) return dx > 0 ? "right" : "left";  /* 水平扇区 */
  return dy < 0 ? (dx > 0 ? "fwdright" : "fwdleft")
                : (dx > 0 ? "backright" : "backleft");
}
const WHEEL_KEYSET = new Set();
function wheelKeyDir(){
  const k = WHEEL_KEYSET;
  if (!k.size) return "stop";
  const f = k.has("fwd"), b = k.has("back"), l = k.has("left"), r = k.has("right");
  if (f && !b && l && !r) return "fwdleft";
  if (f && !b && r && !l) return "fwdright";
  if (b && !f && l && !r) return "backleft";
  if (b && !f && r && !l) return "backright";
  if (f === b) return "stop";                         /* 前后同按抵消 */
  if (l === r) return f ? "fwd" : "back";             /* 左右同按抵消 */
  return f ? "fwd" : (b ? "back" : (l ? "left" : "right"));
}
function wheelBind(){
  const w = document.getElementById("wheel");
  if (!w) return;
  let activeId = null;
  const apply = e => {
    const r = w.getBoundingClientRect();
    wheelSet(wheelDirFromXY(e.clientX - (r.left + r.width/2),
                            e.clientY - (r.top + r.height/2)));
  };
  w.addEventListener("pointerdown", e=>{
    if (!ARMED || SLEEPING) return;
    activeId = e.pointerId;
    try { w.setPointerCapture(e.pointerId); } catch(_){}
    e.preventDefault(); apply(e);
  });
  w.addEventListener("pointermove", e=>{
    if (e.pointerId === activeId){ e.preventDefault(); apply(e); }
  });
  const release = e=>{
    if (activeId !== null && e.pointerId !== activeId) return;
    activeId = null; wheelSet("stop");
  };
  w.addEventListener("pointerup", release);
  w.addEventListener("pointercancel", release);
  w.addEventListener("lostpointercapture", release);
  w.addEventListener("contextmenu", e=>e.preventDefault());
  window.addEventListener("blur", ()=>{ activeId = null; WHEEL_KEYSET.clear(); wheelSet("stop"); });
  /* 键盘：按住 ↑ 再按 ← = 前+左；松开 ← 自动恢复 ↑（不松 ↑） */
  const KMAP = {ArrowUp:"fwd", ArrowDown:"back", ArrowLeft:"left", ArrowRight:"right"};
  window.addEventListener("keydown", e=>{
    const d = KMAP[e.key];
    if (!d) return;
    const t = document.activeElement && document.activeElement.tagName;
    if (t === "INPUT" || t === "TEXTAREA") return;
    e.preventDefault();
    WHEEL_KEYSET.add(d); wheelSet(wheelKeyDir());
  });
  window.addEventListener("keyup", e=>{
    const d = KMAP[e.key];
    if (!d) return;
    WHEEL_KEYSET.delete(d); wheelSet(wheelKeyDir());
  });
}
wheelBind();
setInterval(()=>{ if(ARMED) sendNav(); }, 100);   // 断线保活
let navTimer = 0;
function sendNav(){
  const now = Date.now();
  if (now - navTimer < 60) return;
  navTimer = now;
  api("/api/nav",{x:curNav.x, y:curNav.y, yaw:curNav.yaw});
}

/* 音频列表 */
/* 只显示前 n 个字，超出用 ... 代替（按字符计，兼容中文/emoji） */
function clip(s, n){
  const a = Array.from(String(s == null ? "" : s));
  return a.length > n ? a.slice(0, n).join("") + "..." : a.join("");
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

/* ---- 语音模块三种模式（REQ-038）：语音播报 / 一键喊话 / 双向对讲 ----
   三者同级，互斥显示；语音播报仅自定义音频（系统音已取消），停止播报/循环保留在其面板内。 */
let AUDIO_MODE = localStorage.getItem("s10yk_audio_mode") || "say";   // say | shout | talk

function setAudioMode(m){
  if (m !== "say" && m !== "shout" && m !== "talk") m = "say";
  const prev = AUDIO_MODE;
  AUDIO_MODE = m;
  localStorage.setItem("s10yk_audio_mode", m);
  document.querySelectorAll("#audTabs .tab").forEach(b=>{
    b.classList.toggle("on", b.dataset.tab === m);
  });
  document.getElementById("paneSay").hidden   = (m !== "say");
  document.getElementById("paneShout").hidden = (m !== "shout");
  document.getElementById("paneTalk").hidden  = (m !== "talk");
  /* 离开页签时收尾，避免隐藏面板仍在响 / 仍在录音 */
  if (prev === "say" && m !== "say") astop();
  if (prev === "shout" && m !== "shout"){
    if (SHOUT_REC) shoutUp();
    else api("/api/shout/stop", {});
  }
  if (prev === "talk" && m !== "talk") talkStop();      /* REQ-041：离开双向对讲必收麦 */
  if (m === "shout") shoutTip("长按说话，边说边播（仅 Chrome + HTTPS）");
  if (m === "talk"){ talkTip("双向对讲：手机 ↔ 机器人（仅 Chrome + HTTPS）"); talkMicLine(); }
}

/* 语音播报列表：只列自定义音频（a.say 走 sayd 播放） */
function listItems(){
  return (PRESETS || []).filter(a => !!a.say);
}

function renderList(){
  const box = document.getElementById("alist");
  clearSel();
  box.innerHTML = "";
  const items = listItems();
  if (!items.length){
    const d = document.createElement("div");

    b.onclick = ()=>play(a, b);
    box.appendChild(b);
  }
}

async function loadPresets(){
  const r = await api("/api/audio/presets");
  PRESETS = r.presets || [];
  renderList();
}

/* ---- 摄像头预览（v2.6）：MJPEG 流，<img> 直出，机位可切换 ---- */
let CAM_ON = localStorage.getItem("s10yk_cam") === "1";
let CAM_SRC = localStorage.getItem("s10yk_cam_src") || "video0";
function setCam(src){
  const changed = (CAM_SRC !== src);
  CAM_SRC = src;
  localStorage.setItem("s10yk_cam_src", src);
  document.querySelectorAll("#camTabs .tab").forEach(t=>t.classList.toggle("on", t.dataset.cam===src));
  if (changed && CAM_ON) startCam();     /* 同机位重复点不重连 */
}
function toggleCam(){ setCamOn(!CAM_ON); }
function setCamOn(v){
  CAM_ON = v;
  localStorage.setItem("s10yk_cam", v ? "1" : "0");
  const b = document.getElementById("camBtn"),
        img = document.getElementById("camImg"),
        hint = document.getElementById("camHint");
  b.classList.toggle("on", v);
  b.title = v ? "视频已开启（点击关闭）" : "视频已关闭（点击开启）";
  b.firstElementChild.textContent = v ? "🔓" : "🔒";
  if (!v){
    img.onerror = null; img.onload = null;
    img.removeAttribute("src");
    img.style.display = "none";
    hint.style.display = "flex";
    hint.textContent = "已关闭";
    return;
  }
  startCam();
}
function startCam(){
  const img = document.getElementById("camImg"),
        hint = document.getElementById("camHint");
  hint.style.display = "flex";
  hint.textContent = "连接中…";
  img.style.display = "none";
  img.onerror = function(){
    /* D-030：先检查鉴权状态，只有确实需要登录才弹登录层；否则显示取流失败提示。
       旧代码无条件 showGate() 覆盖了本提示，任何取流错误都会误弹登录层。 */
    fetch("/api/auth", {cache:"no-store"}).then(r=>r.json()).then(a=>{
      if (a && a.required && !a.authed) { showGate(); return; }
      img.style.display = "none";
      hint.style.display = "flex";
      hint.textContent = "画面不可用（机器人端未取到该路流）";
    }).catch(()=>{
      img.style.display = "none";
      hint.style.display = "flex";
      hint.textContent = "画面不可用（连接异常）";
    });
  };
  img.onload = function(){
    img.style.display = "block";
    hint.style.display = "none";
  };
  /* 带 t= 防止浏览器复用缓存的旧 multipart 连接 */
  img.src = "/api/cam/stream?src=" + CAM_SRC + "&t=" + Date.now();
}

/* ---- 一键喊话 = 实时对讲（REQ-039）----
   按住 → POST /api/shout/start 建会话 → AudioWorklet 每 100ms(3200B) 产一片 PCM
   → 串行发送队列实时 POST /api/shout/pcm（边说边播）→ 松手先排空队列再 /stop。
   队列上限 15 片(≈1.5s)：网络跟不上时丢最旧的片，宁可掉字也不让延迟越积越大。
   仅 Chrome + HTTPS（getUserMedia 需安全上下文）。 */
let SHOUT_MODE = "stream";                 /* 实时对讲（clip 通路保留在后端，前端不再使用） */
let SHOUT_REC = false, SHOUT_CTX = null, SHOUT_STREAM = null, SHOUT_NODE = null;
let SHOUT_T0 = 0, SHOUT_BUSY = false, SHOUT_TIP_TMR = 0;
let SHOUT_QUEUE = [], SHOUT_SENDING = false, SHOUT_SENT_B = 0, SHOUT_DROP = 0;
let SHOUT_GEN = 0;                         /* 会话代次：松手收尾途中又按下去时，旧收尾不得误停新会话 */
let SHOUT_RATE = 16000;                    /* 上行 PCM 速率：恒 16k（原生采集在 worklet 内重采样，D-036/D-037） */
let SHOUT_RMS = 0;                         /* 最近一片的麦克风 RMS（0~1），用于电平表/静音诊断 */
const SHOUT_QMAX = 15;                     /* 队列上限（片，1 片=100ms） */
const SHOUT_BATCH = 4;                     /* 单次 POST 最多合并 4 片(400ms)，网络慢时自然变大 */

function shoutTip(t){ const e = document.getElementById("shoutTip"); if (e) e.textContent = t; }
/* 建会话：sayd 忙/设备被占用时抛错，由 shoutDown 统一提示并收尾 */
async function shoutStartSession(){
  const r = await fetch("/api/shout/start", {
    method:"POST", cache:"no-store",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({rate: SHOUT_RATE, channels: 1})
  });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ("start HTTP " + r.status));
  return j;
}

/* 发送泵：同一时刻只有一个请求在飞 → 天然保序（乱序会让 sayd 输出碎音）；
   排队片合并成一批发出，网络慢时批量自然变大，吞吐仍能跟上实时速率。 */
async function shoutPump(){
  if (SHOUT_SENDING) return;
  SHOUT_SENDING = true;
  try{
    while (SHOUT_QUEUE.length){
      const n = Math.min(SHOUT_QUEUE.length, SHOUT_BATCH);
      let buf = SHOUT_QUEUE.shift();
      for (let i = 1; i < n; i++){
        const p = SHOUT_QUEUE.shift();
        const merged = new Uint8Array(buf.length + p.length);
        merged.set(buf, 0); merged.set(p, buf.length);
        buf = merged;
      }
      let sent = false;
      for (let attempt = 0; attempt < 2 && !sent; attempt++){
        let r;
        try{
          r = await fetch("/api/shout/pcm", {method:"POST", cache:"no-store",
            headers:{"Content-Type":"application/octet-stream"}, body:buf});
        }catch(err){
          if (attempt) { shoutTip("上行中断：" + (err.message || err)); }
          break;
        }
        if (r.status === 409 && attempt === 0 && SHOUT_REC){
          /* 会话被看门狗/其它音频入口终止：重建一次再重发这批，句子不会断在这 */
          try{ await shoutStartSession(); continue; }catch(e){ shoutTip("会话重建失败"); break; }
        }
        if (r.ok){ sent = true; SHOUT_SENT_B += buf.length; }
        else break;
      }
    }
  } finally { SHOUT_SENDING = false; }
}

/* 松手后等队列排空（最多 ms 毫秒），把尾音送完再关会话；
   代次变了（用户又按下去了）就立刻退出，别去动新会话 */
async function shoutDrain(ms, gen){
  const t0 = Date.now();
  while ((SHOUT_SENDING || SHOUT_QUEUE.length) && Date.now() - t0 < ms){
    if (gen !== SHOUT_GEN) return;
    await new Promise(r => setTimeout(r, 40));
  }
}
async function shoutInitAudio(talkMode){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    throw new Error("需 HTTPS 且用 Chrome 才能使用麦克风");
  /* D-036 续：喊话（无并发播放）用「裸采集」——AEC/NS 引擎在个别设备上会把
     MediaStream 输出整条变静音，喊话根本用不上它们；对讲保留 AEC 防下行啸叫。 */
  const audio = talkMode
    ? { echoCancellation:true, noiseSuppression:true, autoGainControl:true }
    : { echoCancellation:false, noiseSuppression:false, autoGainControl:false };
  const stream = await navigator.mediaDevices.getUserMedia({ audio });
  const Ctx = window.AudioContext || window.webkitAudioContext;
  /* D-036/D-037：上下文用设备原生采样率（强制 16k 在部分安卓 Chrome 上会把
     MediaStream 输入重采样成静音）；worklet v4 内部统一重采样输出 16k，
     上行带宽 32KB/s——原生 48k 直传要 96KB/s，弱上联网络会大量拥塞丢片。 */
  const ctx = new Ctx();
  SHOUT_RATE = 16000;              /* worklet 输出恒为 16k（shout-processor.js v4） */
  if (ctx.state === "suspended") await ctx.resume();
  let node;
  try{
    await ctx.audioWorklet.addModule("/shout-processor.js");
    node = new AudioWorkletNode(ctx, "shout-processor");
    node.port.onmessage = (ev)=>onPcm(new Uint8Array(ev.data));
  }catch(e){
    // 兜底：老的 ScriptProcessor（已废弃但兼容性好）；同样重采样到 16k、100ms 一片
    node = ctx.createScriptProcessor(4096, 1, 1);
    let acc = new Int16Array(1600), accN = 0;
    node.onaudioprocess = (ev)=>{
      const ch = ev.inputBuffer.getChannelData(0);
      const step = ctx.sampleRate / 16000;
      for (let p = 0; p + 1 < ch.length; p += step){
        const i = p | 0, f = p - i;
        let v = ch[i] + (ch[i + 1] - ch[i]) * f;
        if (v > 1) v = 1; else if (v < -1) v = -1;
        acc[accN++] = v < 0 ? (v * 0x8000) | 0 : (v * 0x7fff) | 0;
        if (accN >= acc.length){
          onPcm(new Uint8Array(acc.buffer));
          acc = new Int16Array(1600); accN = 0;
        }
      }
    };
  }
  const src = ctx.createMediaStreamSource(stream);
  src.connect(node);
  node.connect(ctx.destination);   // Worklet 需接到 destination 才会被驱动
  return {ctx, stream, node};
}
/* 麦克风电平（dBFS）：说话时正常应在 -40~-10dB；持续低于 -54dB 基本是采到静音 */
function micDb(){
  if (!SHOUT_RMS) return "-∞";
  const d = 20 * Math.log10(SHOUT_RMS);
  return (d < -90 ? "≤-90" : d.toFixed(0)) + "dB";
}
function micDead(){ return SHOUT_RMS < 0.002; }   // ≈ -54dB 以下判定疑似静音
function onPcm(u8){
  if (!SHOUT_REC) return;
  /* 电平表（D-036 诊断）：算 RMS 只为显示，不改变音频数据 */
  if (!(u8.byteOffset & 1)){
    const i16 = new Int16Array(u8.buffer, u8.byteOffset, u8.byteLength >> 1);
    let acc = 0;
    for (let i = 0; i < i16.length; i++){ const v = i16[i]; acc += v * v; }
    SHOUT_RMS = Math.sqrt(acc / Math.max(1, i16.length)) / 32768;
  }
  if (SHOUT_QUEUE.length >= SHOUT_QMAX){
    SHOUT_QUEUE.shift();      /* 丢最旧的一片：保住低延迟，不自欺欺人地越说越慢 */
    SHOUT_DROP++;
  }
  SHOUT_QUEUE.push(u8);
  shoutPump();
}
/* 释放麦克风与音频上下文（异常路径与正常收尾共用） */
async function shoutReleaseAudio(){
  try{ if (SHOUT_NODE) SHOUT_NODE.disconnect(); }catch(err){}
  try{ if (SHOUT_STREAM) SHOUT_STREAM.getTracks().forEach(t=>t.stop()); }catch(err){}
  try{ if (SHOUT_CTX) await SHOUT_CTX.close(); }catch(err){}
  SHOUT_CTX = SHOUT_STREAM = SHOUT_NODE = null;
}

/* ---- 麦克风自检（D-036 诊断工具）----
   三阶段各采 2.5s：①裸采集（关 AEC/NS/AGC）②浏览器默认 ③对讲实际约束（开 AEC/NS）。
   输出每阶段的 分贝/帧数/轨道参数，把「采集静音」定位到：
   - ①有声 ②③静音 → AEC/降噪引擎坑（喊话已切裸采集，对讲需戴耳机/我再处理）
   - ①也静音 → 系统层：系统麦克风权限/硬件静音开关/蓝牙耳机/其它App占麦 */
let MIC_TESTING = false;
function _micBoth(t){
  const a = document.getElementById("shoutTip"), b = document.getElementById("talkTip");
  if (a) a.textContent = t;
  if (b) b.textContent = t;
}
async function _micProbe(label, constraints){
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  const tr = stream.getAudioTracks()[0];
  const st = tr.getSettings ? (tr.getSettings() || {}) : {};
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  if (ctx.state === "suspended") await ctx.resume();
  await ctx.audioWorklet.addModule("/shout-processor.js");
  const node = new AudioWorkletNode(ctx, "shout-processor");
  let frames = 0, rms = 0, peak = 0;
  node.port.onmessage = (ev)=>{
    const i16 = new Int16Array(ev.data);
    frames++;
    let acc = 0, pk = 0;
    for (let i = 0; i < i16.length; i++){
      const v = i16[i]; acc += v * v;
      const a = v < 0 ? -v : v; if (a > pk) pk = a;
    }
    const r = Math.sqrt(acc / Math.max(1, i16.length)) / 32768;
    if (r > rms) rms = r;
    if (pk / 32768 > peak) peak = pk / 32768;
  };
  const src = ctx.createMediaStreamSource(stream);
  src.connect(node); node.connect(ctx.destination);
  await new Promise(r=>setTimeout(r, 2500));
  try{ node.disconnect(); src.disconnect(); await ctx.close(); }catch(e){}
  try{ tr.stop(); }catch(e){}
  return {label, frames, rms, peak,
          ch: st.channelCount, rate: st.sampleRate,
          aec: st.echoCancellation, ns: st.noiseSuppression,
          muted: !!(tr.muted || !tr.enabled)};
}
async function micSelfTest(){
  if (MIC_TESTING) return;
  if (SHOUT_REC || TALK_ON){ _micBoth("请先结束喊话/对讲再自检"); return; }
  MIC_TESTING = true;
  try{
    const phases = [
      ["①裸采集", {audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}}],
      ["②浏览器默认", {audio:true}],
      ["③对讲约束", {audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}]
    ];
    const res = [];
    for (const [name, cs] of phases){
      _micBoth("自检" + name + "：采 2.5s，请对着手机说话…（" +
               (res.length ? "已完成 " + res.map(r=>r.label + (r.rms >= 0.002 ? "有声" : "静音")).join("/") + "　" : "") +
               "）");
      res.push(await _micProbe(name, cs));
    }
    const db = (r)=> r.rms > 0 ? (20 * Math.log10(r.rms)).toFixed(0) + "dB" : "-∞";
    const ok = (r)=> r.rms >= 0.002;
    const brief = res.map(r=>r.label + db(r) + "/" + r.frames + "帧").join(" ");
    let verdict;
    if (res.every(ok))
      verdict = "✅ 三阶段都正常（" + brief + "）：采集没问题，若喇叭仍无声请反馈「上行KB」与服务器日志";
    else if (ok(res[0]) && (!ok(res[1]) || !ok(res[2])))
      verdict = "⚠️ 裸采集有声(" + db(res[0]) + ")但默认/对讲约束静音(" + db(res[1]) + "/" + db(res[2]) +
                ")：AEC/降噪引擎坑——喊话已改裸采集应可用；对讲请戴耳机，并把此结果反馈给我";
    else if (res[0].frames === 0)
      verdict = "❌ 裸采集 0 帧：采集图未运行，请反馈手机型号与 Chrome 版本";
    else
      verdict = "❌ 连裸采集都静音(" + brief + (res[0].muted ? " · 轨道被静音!" : "") +
                ")：系统层问题——检查 系统设置→应用→Chrome→麦克风权限、拔掉蓝牙耳机、麦克风静音键、其它占用麦克风的App";
    _micBoth("自检完成：" + verdict);
  }catch(err){
    let msg = String(err && err.message || err);
    if (/permission|denied|NotAllowed/i.test(msg)) msg = "麦克风被拒绝：地址栏🔒里允许，并检查系统应用权限";
    _micBoth("自检失败：" + msg);
  }finally{ MIC_TESTING = false; }
}
async function shoutDown(e){
  if (e){
    e.preventDefault();
    /* 指针捕获：手指滑出按钮也不会断（否则说着说着就断了），松手由 pointerup 收尾 */
    if (e.pointerId != null && e.currentTarget && e.currentTarget.setPointerCapture){
      try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
    }
  }
  if (SHOUT_REC || SHOUT_BUSY) return;
  SHOUT_BUSY = true;
  try{
    /* 先拿麦（可能要弹授权框，别让 sayd 空占声卡等），再建会话 */
    const a = await shoutInitAudio(false);   /* 喊话：裸采集（无并发播放，不需要 AEC） */
    SHOUT_CTX = a.ctx; SHOUT_STREAM = a.stream; SHOUT_NODE = a.node;
    await shoutStartSession();          /* sayd 忙就直接失败，不白说 */
    SHOUT_REC = true; SHOUT_T0 = Date.now(); SHOUT_GEN++;
    SHOUT_QUEUE = []; SHOUT_SENT_B = 0; SHOUT_DROP = 0; SHOUT_RMS = 0;
    const btn = document.getElementById("shoutBtn");
    btn.classList.add("rec"); btn.textContent = "⏹ 松开发送";
    shoutTip("对讲中 0.0s");
    clearInterval(SHOUT_TIP_TMR);
    SHOUT_TIP_TMR = setInterval(()=>{
      if (!SHOUT_REC) return;
      const s = ((Date.now() - SHOUT_T0) / 1000).toFixed(1);
      shoutTip("对讲中 " + s + "s · 麦 " + micDb() + (micDead() ? "（疑似静音）" : "") +
               " · 上行 " + Math.round(SHOUT_SENT_B / 1024) + "KB" +
               (SHOUT_DROP ? " · 拥塞丢 " + SHOUT_DROP + " 片" : ""));
    }, 250);
  }catch(err){
    let msg = String(err && err.message || err);
    if (/permission|denied/i.test(msg)) msg = "麦克风未授权，请在地址栏允许";
    else if (/secure|https|only supported/i.test(msg)) msg = "需要 HTTPS（Chrome 安全上下文）";
    else if (/busy|占用|device/i.test(msg)) msg = "声卡被占用，稍后再试";
    shoutTip("无法开始：" + msg);
    await shoutReleaseAudio();
    try{ await api("/api/shout/stop", {}); }catch(e){}   /* 会话可能已建立，回滚 */
  }finally{ SHOUT_BUSY = false; }
}
async function shoutUp(e){
  if (e) e.preventDefault();
  if (!SHOUT_REC) return;
  SHOUT_REC = false;
  clearInterval(SHOUT_TIP_TMR); SHOUT_TIP_TMR = 0;
  const btn = document.getElementById("shoutBtn");
  btn.classList.remove("rec"); btn.textContent = "🎤 按住说话";
  /* 停采集、释放麦克风 */
  await shoutReleaseAudio();
  const secs = ((Date.now() - SHOUT_T0) / 1000).toFixed(1);
  const gen = SHOUT_GEN;
  shoutTip("收尾中…");
  await shoutDrain(1500, gen);         /* 把最后 1~2 片送完，尾音不被切掉 */
  if (gen !== SHOUT_GEN) return;       /* 收尾期间又按下了：交给新会话，不在这里停 */
  SHOUT_QUEUE = [];
  try{ await api("/api/shout/stop", {}); }catch(err){}
  shoutTip("对讲结束 " + secs + "s · 上行 " + Math.round(SHOUT_SENT_B / 1024) + "KB" +
           (SHOUT_DROP ? "（丢 " + SHOUT_DROP + " 片）" : ""));
}
function bindShout(){
  const btn = document.getElementById("shoutBtn");
  if (!btn) return;
  btn.addEventListener("pointerdown", shoutDown);
  btn.addEventListener("pointerup", shoutUp);
  /* 不监听 pointerleave：已做指针捕获，手指滑出按钮仍继续对讲，松手才结束 */
  btn.addEventListener("pointercancel", ()=>{ if(SHOUT_REC) shoutUp(); });
  window.addEventListener("blur", ()=>{ if(SHOUT_REC) shoutUp(); });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden && SHOUT_REC) shoutUp(); });
  /* REQ-039：一键喊话固定「实时对讲（边说边播）」，不再有录完再播/双击切换 */
  shoutTip("长按说话，边说边播（仅 Chrome + HTTPS）");
  const mt1 = document.getElementById("micTestBtn1");
  if (mt1) mt1.addEventListener("click", micSelfTest);
}

/* ---- 双向对讲（REQ-041，2026-11-17）----
   上行：手机麦 → /api/shout/* → sayd 播放（复用一键喊话那套采集/发送泵）；
   下行：机器人 MIC → 后端 SSH+arecord → GET /api/talk/pcm（chunked PCM）→ Web Audio 排队播。
   MIC 被厂商节点抢占（开麦即 busy / 说话中途被夺 / USB 复位）由后端计数，
   前端实时显示「MIC 被抢占 N 次」——抢占后后端自动重开麦，计数只增不减。 */
let TALK_ON = false, TALK_CTX = null, TALK_GAIN = null, TALK_ABORT = null;
let TALK_CURSOR = 0, TALK_BYTES = 0, TALK_T0 = 0, TALK_TMR = 0, TALK_GEN = 0;
let TALK_PREEMPT = 0, TALK_PREEMPT_TOTAL = 0, TALK_ERR = "";
const TALK_RATE_F = 16000;    /* 与后端 TALK_RATE 一致（16k/mono/S16） */
const TALK_LEAD = 0.12;       /* 起播前预攒 120ms 缓冲，抵掉 Wi-Fi 抖动 */

function talkTip(t){ const e = document.getElementById("talkTip"); if (e) e.textContent = t; }
function talkMicLine(){
  const e = document.getElementById("talkMic");
  if (!e) return;
  e.textContent = "MIC 被抢占 " + TALK_PREEMPT_TOTAL + " 次（本次 " + TALK_PREEMPT + "）" +
                  (TALK_ERR ? " · " + TALK_ERR : "");
  e.classList.toggle("warn", TALK_PREEMPT_TOTAL > 0);
}

/* 下行播放：Int16 → AudioBuffer，按时间戳排队无缝衔接；断流后自动重建 120ms 缓冲 */
function talkPlayPcm(i16){
  if (!TALK_CTX || !i16.length) return;
  const ctx = TALK_CTX, n = i16.length;
  const f32 = new Float32Array(n);
  for (let i = 0; i < n; i++) f32[i] = i16[i] / 32768;
  const buf = ctx.createBuffer(1, n, TALK_RATE_F);   /* 16k 源，浏览器播放时自动重采样 */
  buf.copyToChannel(f32, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(TALK_GAIN);
  const now = ctx.currentTime;
  if (TALK_CURSOR < now + 0.02) TALK_CURSOR = now + TALK_LEAD;   /* 掉队就跳到当下，不追积压 */
  try { src.start(TALK_CURSOR); } catch(err){ try { src.start(); } catch(e){} }
  TALK_CURSOR += n / TALK_RATE_F;
}

/* 下行流读取：fetch + ReadableStream，按 2 字节对齐拼样本（分片边界可能切在样本中间） */
async function talkDownlink(gen){
  const ctrl = new AbortController();
  TALK_ABORT = ctrl;
  try{
    const r = await fetch("/api/talk/pcm", {cache:"no-store", signal: ctrl.signal});
    if (!r.ok || !r.body) throw new Error("HTTP " + r.status);
    const reader = r.body.getReader();
    let rest = new Uint8Array(0);
    while (TALK_ON && gen === TALK_GEN){
      const {value, done} = await reader.read();
      if (done) break;
      if (!value || !value.length) continue;
      TALK_BYTES += value.length;
      const merged = new Uint8Array(rest.length + value.length);
      merged.set(rest, 0); merged.set(value, rest.length);
      const usable = merged.length & ~1;               /* 偶数字节才是一个完整样本序列 */
      if (usable >= 640){                              /* ≥20ms 才送播，减少调度次数 */
        talkPlayPcm(new Int16Array(merged.buffer.slice(0, usable)));
        rest = merged.slice(usable);
      } else rest = merged;
    }
  }catch(err){
    if (TALK_ON && gen === TALK_GEN) talkTip("下行中断：" + (err.message || err));
  }
}

async function talkStart(){
  if (TALK_ON) return;
  const btn = document.getElementById("talkBtn");
  if (btn) btn.disabled = true;
  talkTip("正在开启对讲…");
  try{
    /* 先拿手机麦（可能要弹授权框），再开后端采集；任一步失败都回滚 */
    const a = await shoutInitAudio(true);    /* 对讲：保留 AEC，防下行在手机外放时啸叫 */
    SHOUT_CTX = a.ctx; SHOUT_STREAM = a.stream; SHOUT_NODE = a.node;
    const r = await fetch("/api/talk/start", {method:"POST", cache:"no-store",
      headers:{"Content-Type":"application/json"}, body:"{}"});
    const j = await r.json().catch(()=>({}));
    TALK_PREEMPT = j.preempt || 0; TALK_PREEMPT_TOTAL = j.preempt_total || 0;
    TALK_ERR = j.err || j.error || "";
    talkMicLine();
    if (!r.ok || j.ok === false)
      throw new Error("机器人 MIC 打不开" + (TALK_ERR ? "：" + TALK_ERR : "（可能被厂商节点占用）"));
    await shoutStartSession();            /* 上行会话（sayd 播放） */
    TALK_ON = true; TALK_GEN++; SHOUT_GEN++;
    SHOUT_REC = true; SHOUT_T0 = Date.now();
    SHOUT_QUEUE = []; SHOUT_SENT_B = 0; SHOUT_DROP = 0; SHOUT_RMS = 0;
    TALK_BYTES = 0; TALK_T0 = Date.now(); TALK_CURSOR = 0;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    TALK_CTX = new Ctx();
    if (TALK_CTX.state === "suspended") await TALK_CTX.resume();
    TALK_GAIN = TALK_CTX.createGain();
    TALK_GAIN.gain.value = 0.9;           /* 略降下行增益：手机外放时减轻回授/啸叫 */
    TALK_GAIN.connect(TALK_CTX.destination);
    talkDownlink(TALK_GEN);
    if (btn){ btn.classList.add("rec"); btn.textContent = "⏹ 结束对讲"; }
    clearInterval(TALK_TMR);
    TALK_TMR = setInterval(()=>{
      if (!TALK_ON) return;
      const s = ((Date.now() - TALK_T0) / 1000).toFixed(1);
      talkTip("对讲中 " + s + "s · 下行 " + Math.round(TALK_BYTES / 1024) + "KB" +
              " · 上行 " + Math.round(SHOUT_SENT_B / 1024) + "KB · 麦 " + micDb() +
              (micDead() ? "（疑似静音）" : "") +
              (SHOUT_DROP ? " · 上行丢 " + SHOUT_DROP + " 片" : ""));
    }, 400);
  }catch(err){
    let msg = String(err && err.message || err);
    if (/permission|denied/i.test(msg)) msg = "麦克风未授权，请在地址栏允许";
    else if (/secure|https|only supported/i.test(msg)) msg = "需要 HTTPS（Chrome 安全上下文）";
    talkTip("无法开始：" + msg);
    TALK_ON = false;
    try{ if (TALK_ABORT) TALK_ABORT.abort(); }catch(e){}
    await shoutReleaseAudio();
    try{ await api("/api/talk/stop", {}); }catch(e){}
  }finally{ if (btn) btn.disabled = false; }
}

async function talkStop(){
  if (!TALK_ON) return;
  TALK_ON = false; TALK_GEN++;
  clearInterval(TALK_TMR); TALK_TMR = 0;
  const btn = document.getElementById("talkBtn");
  if (btn){ btn.classList.remove("rec"); btn.textContent = "📞 开始对讲"; }
  const secs = ((Date.now() - TALK_T0) / 1000).toFixed(1);
  const bytes = TALK_BYTES;
  try{ if (TALK_ABORT) TALK_ABORT.abort(); }catch(e){}
  TALK_ABORT = null;
  SHOUT_REC = false;                      /* 先停采集，onPcm 不再入队 */
  await shoutReleaseAudio();
  const gen = SHOUT_GEN;
  await shoutDrain(1200, gen);            /* 把上行尾音送完再关会话 */
  SHOUT_QUEUE = [];
  try{ await api("/api/shout/stop", {}); }catch(e){}
  try{ await api("/api/talk/stop", {}); }catch(e){}
  try{ if (TALK_CTX) await TALK_CTX.close(); }catch(e){}
  TALK_CTX = null; TALK_GAIN = null; TALK_CURSOR = 0;
  talkTip("对讲结束 " + secs + "s · 下行 " + Math.round(bytes / 1024) + "KB");
}
function bindTalk(){
  const btn = document.getElementById("talkBtn");
  if (!btn) return;
  btn.addEventListener("click", ()=>{ TALK_ON ? talkStop() : talkStart(); });
  /* 切后台就停：后台音频会被浏览器掐，留着只会积累延迟 */
  document.addEventListener("visibilitychange", ()=>{ if (document.hidden && TALK_ON) talkStop(); });
  window.addEventListener("blur", ()=>{ if (TALK_ON) talkStop(); });
  const mt2 = document.getElementById("micTestBtn2");
  if (mt2) mt2.addEventListener("click", micSelfTest);
}

/* ---- REQ-029：网络时延 / 实时带宽（纯数值实时显示，无文字说明） ----
   时延 = /api/status 请求往返耗时（EMA 平滑）；
   带宽 = 后端统计的前后端双向交互流量（上行请求 + 下行响应/视频，3s 滑窗），由 /api/status 的 net.bps 下发。
   不再用 /api/bw 探测块（那是人为流量，关摄像头仍显示几十 Mb 属失真）。 */
const NET = { rtt: null, bps: null };
function renderNet(){
  const el = document.getElementById("netstat");
  if (!el) return;
  const rtt = (NET.rtt == null) ? "…ms" : NET.rtt.toFixed(0) + "ms";
  const mbps = (NET.bps == null) ? null : NET.bps / 1e6;
  const bw  = (mbps == null) ? "…Mb/s"
            : (mbps < 0.1 && mbps > 0) ? mbps.toFixed(2) + "Mb/s"
            : mbps.toFixed(mbps < 10 ? 1 : 0) + "Mb/s";
  el.textContent = rtt + "  " + bw;
}

/* 状态轮询（v2.3：防重入 + 回前台立即刷新；停留计时提示按 REQ-027 取消） */
let POLLING = false;
async function poll(){
  if (POLLING) return;          /* 上一轮未结束不再叠加 */
  POLLING = true;
  try{
    const t0 = performance.now();
    const s = await api("/api/status");
    /* REQ-029：status 往返耗时作时延；net.bps 为后端真实出向流量（EMA 轻平滑，排除未鉴权返回） */
    if (s && !s.__unauth){
      const rtt = performance.now() - t0;
      NET.rtt = (NET.rtt == null) ? rtt : NET.rtt * 0.7 + rtt * 0.3;
      if (s.net && s.net.bps != null){
        NET.bps = (NET.bps == null) ? s.net.bps : NET.bps * 0.5 + s.net.bps * 0.5;
      }
      renderNet();
      /* REQ-033：档位以后端为准同步（兼容多端切换），不一致时更新按钮显示 */
      if (s.steer && s.steer.gear_idx != null && s.steer.gear_idx !== GEAR_IDX){
        GEAR_IDX = s.steer.gear_idx;
        renderGear();
      }
    }
    document.getElementById("conn").textContent = "已连接";
    document.getElementById("conn").classList.add("on");
    const m = s.motion || {};
    /* REQ-042：休眠状态以后端回报为准（0x1001 阻尼趴下确认 / 请求标志），多端切换保持一致 */
    if (m.sleep != null && !!m.sleep !== SLEEPING) setSleep(!!m.sleep);
    document.getElementById("s_state").textContent = STATE_TXT[m.state] ?? m.state ?? "-";
    /* D-039 遗留提示：state=0 且贴地可能是厂商休眠（手柄/闲置触发），届时站立/行走均无效 */
    document.getElementById("s_state").style.color = m.suspect ? "var(--warn)" : "";
    if (m.suspect) document.getElementById("s_state").title = "疑似休眠（state=0 且贴地）：若站立/行走无效，请先点「唤醒」或用手柄退出休眠";
    else document.getElementById("s_state").title = "";
    document.getElementById("s_gait").textContent = GAIT_TXT[m.gait] ?? ("0x"+(m.gait>>>0).toString(16)) ?? "-";
    /* v2.5：步态按钮高亮跟随实际回报值，避免"点了但被缓存"时看不出到底切没切 */
    CUR_GAIT = Number(m.gait) || 0;
    const GB = {[G_FLAT]:"g_flat",[G_STAIR]:"g_stair",[G_HIGH]:"g_high"};
    for (const k in GB){ const e = document.getElementById(GB[k]); if (e) e.classList.toggle("on", Number(m.gait) === Number(k)); }
    document.getElementById("s_vel").textContent = (m.vel_x!=null? m.vel_x.toFixed(2)+"/"+m.vel_y.toFixed(2) : "-");
    const a = s.audio || {};
    const ATXT = {0:"空闲", 1:"播放中", 2:"故障"};
    const ve = document.getElementById("s_audio");
    ve.textContent = (s.volume != null) ? s.volume + "%" : "-";
    ve.style.color = (s.volume != null && s.volume < (s.volume_target ?? 100)) ? "var(--warn)" : "";
    document.getElementById("s_audio_st").textContent =
      a.state==null ? "-" : (ATXT[a.state] ?? ("状态"+a.state));
    ve.title = (a.state===1 && a.id) ? ("id="+a.id) : "";
    /* 电量（v2.2）：主值百分比，充电绿色+⚡，<20% 橙、<10% 红；副行 电压+温度 */
    const b = s.battery || {};
    const be = document.getElementById("s_batt");
    be.textContent = (b.level != null) ? b.level + "%" : "-";
    document.getElementById("s_batt_st").textContent =
      (b.charging ? "⚡" : "") +
      (b.voltage != null ? b.voltage.toFixed(1) + "V" : "-");
    be.title = (b.temp != null) ? (b.temp + "℃") : "";
    document.getElementById("s_batt").style.color =
      b.charging ? "var(--ok)" :
      (b.level != null && b.level < 10) ? "var(--danger)" :
      (b.level != null && b.level < 20) ? "var(--warn)" : "";
    /* 布局优化：转向/高度/里程并入「状态」标题同一行，删掉底部 hint 行以压缩高度
       REQ-027：取消「运动/电量数据停留 Xs」计时提示（原 ageM/ageB/stale 逻辑删除），
       仅保留起立中与转向/高度/里程；显式移除 warn 类避免历史残留 */
    const sl = document.getElementById("s_line");
    sl.textContent =
      (Date.now() < STAND_TIP ? "⏳ 起立中 · " : "") +
      `转向 ${(m.vel_yaw??0).toFixed(2)} · 高 ${(m.height??0).toFixed(2)}m` +
      (m.remain_mile?` · 里程 ${m.remain_mile}`:"");
    sl.classList.remove("warn");
    /* 实时对讲：后端会话若被看门狗/其它音频入口终止，发送泵会自动重建，这里只提示 */
    if (s.shout && !s.shout.active && SHOUT_REC && SHOUT_MODE === "stream")
      shoutTip("会话中断，正在自动重连…");
    /* REQ-041：双向对讲状态（含 MIC 抢占计数）——后端每 500ms 随 /api/status 下发 */
    if (s.talk){
      TALK_PREEMPT_TOTAL = s.talk.preempt_total || 0;
      if (TALK_ON){
        TALK_PREEMPT = s.talk.preempt || 0;
        TALK_ERR = s.talk.err || "";
        talkMicLine();
        if (!s.talk.active) talkStop();     /* 后端采集已终止（重开次数用尽/超时） */
      } else {
        TALK_PREEMPT = 0;
        talkMicLine();
      }
    }
    if (s.armed !== ARMED) setArm(s.armed);
    document.getElementById("alog").textContent = (s.log||[]).join("\n") || "-";
  }catch(e){
    document.getElementById("conn").textContent = "连接断开";
    document.getElementById("conn").classList.remove("on");
  }finally{
    POLLING = false;
  }
}
/* v2.3：标签页回前台 / 窗口聚焦时立即刷新，不等下一个 500ms 周期 */
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) poll(); });
window.addEventListener("focus", ()=>poll());
window.addEventListener("pageshow", ()=>poll());
/* REQ-031：日志模块默认隐藏——2 秒内连点顶部「🐾 S10 遥控台」标题 5 次显示，模块内「隐藏」按钮再次隐藏 */
let LOG_CLICK_N = 0, LOG_CLICK_TS = 0;
function setLogVisible(v){
  const box = document.getElementById("logBox");
  if (box) box.hidden = !v;
  LOG_CLICK_N = 0;
}
function hideLog(){ setLogVisible(false); }
function bindLogToggle(){
  const t = document.getElementById("consoleTitle");
  if (!t) return;
  t.addEventListener("click", ()=>{
    const now = Date.now();
    if (now - LOG_CLICK_TS > 2000) LOG_CLICK_N = 0;  /* 超过 2s 重新计数 */
    LOG_CLICK_TS = now;
    if (++LOG_CLICK_N >= 5) setLogVisible(true);
  });
}
/* v2.7：先确认鉴权通过再启动轮询，未登录只显示登录层（避免 401 刷屏） */
(async function boot(){
  const ok = await checkAuth();
  if (!ok) return;
  bindLogToggle();
  renderGear();          /* REQ-033：初始化档位按钮为默认中速 */
  setArm(false);
  setLoop(LOOP);
  setCam(CAM_SRC);
  if (CAM_ON) setCamOn(true);   /* 上次开着视频则自动恢复 */
  bindShout();                  /* 一键喊话：按住说话 */
  bindTalk();                   /* 双向对讲：一键开/关（REQ-041） */
  setAudioMode(AUDIO_MODE);     /* REQ-038：恢复上次的语音页签（默认「语音播报」） */
  loadPresets();
  poll();
  setInterval(poll, 500);
})();
document.getElementById("gateInput").addEventListener("keydown", (e)=>{ if (e.key === "Enter") doLogin(); });

</script>
